title: Shahbaz Chaudhary
tagline: Tools for Trading, Data and Teaching
description: >-
  Shahbaz Chaudhary builds tools for trading-system developers, data scientists
  and teachers, including FIX Parser, Agent Debugger and Class Planner.
url: https://shahbaz.sh
repository: falconair/falconair.github.com
baseurl: ""
lang: en_US

author:
  name: Shahbaz Chaudhary
  email: shahbazc@gmail.com
  job_title: Software developer and University of Chicago lecturer
  same_as:
    - https://github.com/falconair
    - https://www.linkedin.com/in/shahbaz-chaudhary/

# Google Analytics 4 measurement ID (G-XXXXXXXXXX). Only added to production builds.
google_analytics:

# Default image for link previews (Open Graph, Twitter)
og_image: /img/og-default.png

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

permalink: /:year/:month/:day/:title.html

plugins:
  - jekyll-sitemap

include: ['_pages']
exclude: ['Gemfile', 'Gemfile.lock', 'vendor', 'README.md', 'css/sass', 'css/style.scss']

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post_page }
  - scope: { path: "assets" }
    values: { sitemap: false }
