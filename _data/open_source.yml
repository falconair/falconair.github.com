# Open source projects on the home page, in the order shown.
# image is optional: an 800x500 screenshot in img/apps/
# language marks a code library (for search engines); leave it out otherwise
# since is optional: the year the work really began, not the age of a repo.
# Leave it out for anything built in 2026.
# rewritten is optional: the year the current code replaced the original.
- name: fix.js
  url: https://github.com/falconair/fix.js
  tag: Node.js
  language: TypeScript
  since: 2012
  rewritten: 2026
  description: >-
    A FIX protocol library for building trading tools. Client and server
    sessions with logon, heartbeats and resends handled, and messages with FIX
    names. Tested against QuickFIX/J.

- name: sklearn-embeddings
  url: https://github.com/falconair/sklearn-embeddings
  tag: Python
  language: Python
  since: 2025
  description: >-
    Sentence-transformer embeddings as a scikit-learn pipeline step, so a text
    classifier encodes, fits, predicts and saves as one model. On PyPI.

- name: wireframes
  url: https://github.com/falconair/wireframes
  tag: Agent skill
  description: >-
    A skill for Claude Code, Codex, Copilot, Cursor and other coding agents.
    When the agent proposes UI changes, it draws cheap Now vs Proposed
    wireframes instead of writing paragraphs. A picture is worth a thousand
    words.

- name: Lecture notes
  url: https://github.com/falconair/lectures
  tag: Jupyter
  since: 2019  # the notes began in the ProgrammingForAnalytics repo
  description: >-
    Jupyter notebooks from my University of Chicago classes: Python, pandas,
    time series, machine learning, the shell and git.
