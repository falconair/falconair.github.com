---
layout: default
---
<article class="post wrap">
  <header class="post-header">
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <nav class="post-nav" aria-label="More posts">
    {% if page.previous %}<a rel="prev" href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a rel="next" href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
  </nav>

  {% include disqus.html %}
</article>
